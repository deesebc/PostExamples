name=PropertiesConfig

appenders = apConsole

appender.apConsole.type = Console
appender.apConsole.name = STDOUT
appender.apConsole.layout.type = PatternLayout
appender.apConsole.layout.pattern = [%-5level] %d{yyyy-MM-dd HH:mm:ss.SSS} - %c{1} [%t] %msg%n

loggers=lConsole
logger.lConsole.name=com.example
logger.lConsole.level = debug
logger.lConsole.appenderRefs = apConsole

rootLogger.level = info
rootLogger.appenderRefs = stdout
rootLogger.appenderRef.stdout.ref = STDOUT